<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный Словарный Диктант</title>
    <!-- Подключаем Tailwind CSS для красивого дизайна -->
    <script src="https://jsdelivr.net"></script>
    <style>
        .wrong-letter { color: #ef4444; text-decoration: underline; font-weight: bold; }
        .correct-letter { color: #22c55e; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-6 md:p-8">
        <!-- Заголовок -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-indigo-600 mb-2">Словарный диктант</h1>
            <p class="text-slate-500">Проверьте свою грамотность интерактивно</p>
        </header>

        <!-- ЭКРАН 1: Выбор темы -->
        <div id="screen-select" class="space-y-6">
            <h2 class="text-xl font-bold text-center">Выберите тему диктанта:</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="topics-list">
                <!-- Темы добавятся автоматически через JS -->
            </div>
        </div>

        <!-- ЭКРАН 2: Прохождение диктанта -->
        <div id="screen-quiz" class="hidden space-y-6">
            <div class="flex justify-between items-center text-sm text-slate-400">
                <span id="topic-title" class="font-medium text-slate-600">Тема</span>
                <span id="progress-text">Слово 1 из 10</span>
            </div>
            
            <!-- Полоса прогресса -->
            <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-indigo-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <!-- Карточка со словом -->
            <div class="bg-indigo-50/50 border border-indigo-100 rounded-xl p-8 text-center my-6">
                <div id="word-display" class="text-3xl md:text-4xl font-bold tracking-wide text-slate-700">
                    <!-- Слово с пропуском, например: Р..стение -->
                </div>
            </div>

            <!-- Поле ввода -->
            <div class="flex flex-col sm:flex-row gap-3 justify-center items-center">
                <input type="text" id="letter-input" maxlength="2" placeholder="Вставьте букву(ы)" 
                       class="w-full sm:w-48 text-center text-xl p-3 border-2 border-slate-200 rounded-xl focus:border-indigo-500 focus:outline-none uppercase">
                <button id="btn-submit" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition-colors shadow-md">
                    Ответить
                </button>
            </div>
        </div>

        <!-- ЭКРАН 3: Результаты -->
        <div id="screen-results" class="hidden text-center space-y-6">
            <h2 class="text-2xl font-bold text-slate-800">Результаты диктанта</h2>
            <div class="text-6xl font-black text-indigo-600" id="score-text">0 / 0</div>
            <p class="text-slate-500 id="feedback-text""></p>

            <!-- Работа над ошибками -->
            <div class="text-left bg-slate-100 rounded-xl p-4 max-h-60 overflow-y-auto hidden" id="mistakes-section">
                <h3 class="font-bold text-red-600 mb-2">Ваши ошибки:</h3>
                <ul id="mistakes-list" class="space-y-1 text-sm list-disc pl-5"></ul>
            </div>

            <button id="btn-restart" class="bg-slate-800 hover:bg-slate-900 text-white font-semibold px-6 py-3 rounded-xl transition-colors">
                На главную
            </button>
        </div>
    </div>

    <script>
        // БАЗА ДАННЫХ ДИКТАНТОВ (Сюда Клод может генерировать новые темы)
        const dictantsData = {
            roots: {
                title: "Чередующиеся гласные (ращ/рос/раст)",
                words: [
                    { display: "Р..стение", correct: "а", full: "Растение" },
                    { display: "Выр..щенный", correct: "а", full: "Выращенный" },
                    { display: "Водоросли", correct: "о", full: "Водоросли" }, // ловушка без пропуска
                    { display: "Р..сток", correct: "о", full: "Росток" }, // исключение
                    { display: "Отрасль", correct: "а", full: "Отрасль" }  // исключение
                ]
            },
            prefixes: {
                title: "Приставки ПРЕ- и ПРИ-",
                words: [
                    { display: "Пр..красный", correct: "е", full: "Прекрасный" },
                    { display: "Пr..бывать в город", correct: "и", full: "Прибывать" },
                    { display: "Пр..одолеть", correct: "е", full: "Преодолеть" },
                    { display: "Пр..открыть", correct: "и", full: "Приоткрыть" }
                ]
            }
        };

        // Состояние приложения
        let currentTopic = null;
        let currentWordIndex = 0;
        let correctAnswersCount = 0;
        let userMistakes = [];

        // Элементы интерфейса
        const sSelect = document.getElementById('screen-select');
        const sQuiz = document.getElementById('screen-quiz');
        const sResults = document.getElementById('screen-results');
        const topicsList = document.getElementById('topics-list');

        // Инициализация меню тем
        function initMenu() {
            topicsList.innerHTML = '';
            Object.keys(dictantsData).forEach(key => {
                const button = document.createElement('button');
                button.className = "w-full text-left p-4 border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 rounded-xl font-medium transition-all";
                button.textContent = dictantsData[key].title;
                button.onclick = () => startQuiz(key);
                topicsList.appendChild(button);
            });
        }

        // Запуск теста
        function startQuiz(topicKey) {
            currentTopic = dictantsData[topicKey];
            currentWordIndex = 0;
            correctAnswersCount = 0;
            userMistakes = [];
            
            document.getElementById('topic-title').textContent = currentTopic.title;
            sSelect.classList.add('hidden');
            sResults.classList.add('hidden');
            sQuiz.classList.remove('hidden');
            
            showWord();
        }

        // Показ текущего слова
        function showWord() {
            const wordData = currentTopic.words[currentWordIndex];
            document.getElementById('word-display').textContent = wordData.display;
            document.getElementById('progress-text').textContent = `Слово ${currentWordIndex + 1} из ${currentTopic.words.length}`;
            
            const progressPercent = (currentWordIndex / currentTopic.words.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            
            const input = document.getElementById('letter-input');
            input.value = '';
            input.focus();
        }

        // Проверка ответа
        function checkAnswer() {
            const input = document.getElementById('letter-input');
            const userAnswer = input.value.trim().toLowerCase();
            const wordData = currentTopic.words[currentWordIndex];

            if (!userAnswer) return; // Не пускать пустой ответ

            if (userAnswer === wordData.correct.toLowerCase()) {
                correctAnswersCount++;
            } else {
                userMistakes.push({
                    wrong: wordData.display.replace('..', `<span class="wrong-letter">${userAnswer || '_'}</span>`),
                    right: wordData.full
                });
            }

            currentWordIndex++;
            if (currentWordIndex < currentTopic.words.length) {
                showWord();
            } else {
                showResults();
            }
        }

        // Показ результатов
        function showResults() {
            sQuiz.classList.add('hidden');
            sResults.classList.remove('hidden');
            
            document.getElementById('score-text').textContent = `${correctAnswersCount} / ${currentTopic.words.length}`;
            
            const mistakesSection = document.getElementById('mistakes-section');
            const mistakesList = document.getElementById('mistakes-list');
            mistakesList.innerHTML = '';

            if (userMistakes.length > 0) {
                mistakesSection.classList.remove('hidden');
                userMistakes.forEach(m => {
                    const li = document.createElement('li');
                    li.innerHTML = `Вместо слова <strong>${m.right}</strong> получилось "${m.wrong}"`;
                    mistakesList.appendChild(li);
                });
            } else {
                mistakesSection.classList.add('hidden');
            }
        }

        // Слушатели событий
        document.getElementById('btn-submit').onclick = checkAnswer;
        document.getElementById('letter-input').onkeydown = (e) => { if(e.key === 'Enter') checkAnswer(); };
        document.getElementById('btn-restart').onclick = () => {
            sResults.classList.add('hidden');
            sSelect.classList.remove('hidden');
            initMenu();
        };

        // Старт
        initMenu();
    </script>
</body>
</html>
